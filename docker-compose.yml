version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rescuegrid_db
    environment:
      POSTGRES_USER: rescuegrid
      POSTGRES_PASSWORD: rescuegrid_secret
      POSTGRES_DB: rescuegrid
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
